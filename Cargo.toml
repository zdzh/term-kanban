[workspace]
resolver = "2"
members = ["crates/kanban-core", "crates/kanban-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
